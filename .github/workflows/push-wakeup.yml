name: Push wake-up

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Send push wake-up
        env:
          APP_URL: ${{ vars.APP_URL }}
          PUSH_WAKEUP_SECRET: ${{ secrets.PUSH_WAKEUP_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL"
          test -n "$PUSH_WAKEUP_SECRET"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $PUSH_WAKEUP_SECRET" \
            "$APP_URL/api/push/wakeup"
